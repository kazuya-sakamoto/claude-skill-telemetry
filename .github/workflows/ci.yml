name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # dist/ はプラグインが clone で配布されるためコミットしている。
      # 手で書き換えた dist が入り込まないよう、再ビルドして差分が出ないことを見る。
      - run: npm run build
      - run: git diff --exit-code -- dist/
